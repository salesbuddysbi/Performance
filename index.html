<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Performance Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom toggle styles */
        .toggle-btn { transition: all 0.2s ease-in-out; }
        .toggle-active { background-color: #2563eb; color: white; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); }
        .toggle-inactive { background-color: #e2e8f0; color: #475569; hover:bg-gray-300; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- 1. Upload Overlay -->
    <div id="upload-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-8 rounded-2xl shadow-2xl text-center max-w-md w-full">
            <svg class="mx-auto h-12 w-12 text-blue-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <h2 class="text-2xl font-bold mb-2">Upload Master Data</h2>
            <p class="text-gray-500 mb-6 text-sm">No default 'Kollam Cluster.xlsx' found. Please upload your file to continue.</p>
            <input type="file" id="file-upload" accept=".xlsx, .xls" class="hidden">
            <button onclick="document.getElementById('file-upload').click()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition w-full">Browse File</button>
        </div>
    </div>

    <!-- 2. Landing Page -->
    <div id="landing-page" class="hidden flex-1 flex flex-col items-center justify-center bg-gray-50 h-full w-full fade-in z-40">
        <div class="mb-12 text-center">
            <h1 class="text-5xl font-extrabold text-gray-900 mb-4 tracking-tight">Performance Portal</h1>
            <p class="text-xl text-gray-500">Select a module to view business analytics</p>
        </div>
        
        <div class="max-w-4xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-8 w-full">
            <!-- Fresh Business Card -->
            <button onclick="openDashboard('fresh')" class="bg-white p-10 rounded-3xl shadow-lg hover:shadow-2xl transition transform hover:-translate-y-2 flex flex-col items-center justify-center gap-6 border border-gray-100 group">
                <div class="p-5 bg-blue-50 rounded-full group-hover:bg-blue-100 group-hover:scale-110 transition duration-300">
                    <svg class="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                </div>
                <div>
                    <h2 class="text-3xl font-bold text-gray-800 group-hover:text-blue-600 transition mb-2">Fresh Business</h2>
                    <p class="text-gray-500 text-center">Track new policy acquisitions, NOP counts, and premium.</p>
                </div>
            </button>

            <!-- Renewal Performance Card -->
            <button onclick="openDashboard('renewal')" class="bg-white p-10 rounded-3xl shadow-lg hover:shadow-2xl transition transform hover:-translate-y-2 flex flex-col items-center justify-center gap-6 border border-gray-100 group">
                <div class="p-5 bg-green-50 rounded-full group-hover:bg-green-100 group-hover:scale-110 transition duration-300">
                    <svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </div>
                <div>
                    <h2 class="text-3xl font-bold text-gray-800 group-hover:text-green-600 transition mb-2">Renewal Performance</h2>
                    <p class="text-gray-500 text-center">Track retention against previous year's overall base (Fresh & Renewal).</p>
                </div>
            </button>
        </div>
    </div>

    <!-- 3. Dashboard View -->
    <div id="app-container" class="hidden flex-1 flex flex-col h-full bg-gray-50">
        <!-- Header -->
        <header class="bg-white shadow-sm z-20 sticky top-0">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-4">
                    <div class="flex items-center gap-4">
                        <button onclick="goHome()" class="p-2 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        </button>
                        <h1 class="text-2xl font-bold text-gray-900" id="dashboard-title">Dashboard</h1>
                    </div>
                </div>
            </div>
        </header>

        <!-- Filter Controls (Choose Easily) -->
        <div class="bg-white border-b border-gray-200 shadow-sm z-10">
            <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                    
                    <!-- Easy Toggle Sub-modules -->
                    <div class="flex bg-gray-100 p-1.5 rounded-xl w-fit">
                        <button id="sub-agent" class="toggle-btn px-6 py-2.5 rounded-lg text-sm font-semibold toggle-active" onclick="switchSubModule('agent')">Agent</button>
                        <button id="sub-manager" class="toggle-btn px-6 py-2.5 rounded-lg text-sm font-semibold toggle-inactive" onclick="switchSubModule('manager')">Manager</button>
                        <button id="sub-cluster" class="toggle-btn px-6 py-2.5 rounded-lg text-sm font-semibold toggle-inactive" onclick="switchSubModule('cluster')">Cluster</button>
                    </div>
                    
                    <!-- Dropdown Filters -->
                    <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4 w-full md:w-auto">
                        <select id="year-select" class="block w-full sm:w-48 pl-4 pr-10 py-3 text-sm border-gray-300 bg-gray-50 border focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 rounded-xl shadow-sm transition" onchange="renderDashboard()">
                            <option value="">Select Financial Year...</option>
                        </select>
                        
                        <select id="name-select" class="block w-full sm:w-72 pl-4 pr-10 py-3 text-sm border-gray-300 bg-gray-50 border focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 rounded-xl shadow-sm transition" onchange="renderDashboard()">
                            <option value="">Select Name...</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Dashboard Content -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="max-w-7xl mx-auto space-y-8 fade-in" id="dashboard-content">
                
                <!-- SUMMARY CARDS (Dynamically populated) -->
                <div id="summary-section" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- Injected via JS based on module -->
                </div>

                <!-- CALENDAR GRID -->
                <div>
                    <div class="flex justify-between items-end mb-4">
                        <h2 class="text-xl font-bold text-gray-800">Month-wise Breakdown</h2>
                        <span class="text-xs font-medium text-gray-500 bg-gray-200 px-3 py-1 rounded-full" id="data-context-label">Excluding Endorsements</span>
                    </div>
                    <div id="fy-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                        <!-- Cards generated via JS -->
                    </div>
                </div>

                <!-- CHART -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold text-gray-800 mb-6">Performance Trend</h2>
                    <div class="relative h-80 w-full">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // === COLUMNS MAPPING ===
        const COL_AGENT = "Intermediary Name";
        const COL_MANAGER = "SSM Name";
        const COL_DATE = "Policy Start Date";
        const COL_TYPE = "Policy Type"; 
        const COL_PREM = "GWP";
        const COL_TRANSACTION = "Transaction Type";

        const FY_MONTHS = ["Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "Jan", "Feb", "Mar"];

        let rawData = [];
        let chartInstance = null;
        let state = { main: 'fresh', sub: 'agent' };

        document.addEventListener("DOMContentLoaded", () => {
            attemptFetchDefaultFile();
            document.getElementById('file-upload').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) loadExcel(file);
            });
        });

        async function attemptFetchDefaultFile() {
            try {
                let response = await fetch('Kollam Cluster.xlsx');
                if (!response.ok) response = await fetch('data.xlsx');
                if (!response.ok) throw new Error('File not found');
                
                const arrayBuffer = await response.arrayBuffer();
                parseExcelData(arrayBuffer);
            } catch (error) {
                document.getElementById('upload-overlay').classList.remove('hidden');
            }
        }

        function loadExcel(file) {
            const reader = new FileReader();
            reader.onload = (e) => parseExcelData(e.target.result);
            reader.readAsArrayBuffer(file);
        }

        function parseExcelData(buffer) {
            try {
                const workbook = XLSX.read(buffer, { type: 'array', cellDates: true });
                rawData = [];
                workbook.SheetNames.forEach(sheetName => {
                    const sheet = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                    rawData = rawData.concat(sheet);
                });
                
                document.getElementById('upload-overlay').classList.add('hidden');
                document.getElementById('landing-page').classList.remove('hidden');
            } catch (err) {
                alert("Error parsing Excel file.");
                console.error(err);
            }
        }

        // === NAVIGATION LOGIC ===
        function openDashboard(mainModule) {
            state.main = mainModule;
            
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            document.getElementById('dashboard-title').innerText = mainModule === 'fresh' 
                ? 'Fresh Business Overview' 
                : 'Renewal Performance Overview';
            
            switchSubModule('agent'); 
        }

        function goHome() {
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('landing-page').classList.remove('hidden');
            // Clear Dashboard data visually so it's fresh on next entry
            document.getElementById('summary-section').innerHTML = '';
            document.getElementById('fy-grid').innerHTML = '';
            if(chartInstance) chartInstance.destroy();
        }

        function switchSubModule(subModule) {
            state.sub = subModule;
            ['agent', 'manager', 'cluster'].forEach(m => {
                const btn = document.getElementById(`sub-${m}`);
                if (m === subModule) {
                    btn.classList.remove('toggle-inactive');
                    btn.classList.add('toggle-active');
                } else {
                    btn.classList.remove('toggle-active');
                    btn.classList.add('toggle-inactive');
                }
            });
            updateDropdowns();
        }

        // === FILTERS ===
        function updateDropdowns() {
            const yearSelect = document.getElementById('year-select');
            const nameSelect = document.getElementById('name-select');
            
            const years = [...new Set(rawData.map(row => {
                if(!row[COL_DATE]) return null;
                const d = new Date(row[COL_DATE]);
                if (isNaN(d)) return null;
                return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
            }).filter(y => y !== null))].sort((a, b) => b - a);

            yearSelect.innerHTML = '<option value="">Select Financial Year...</option>' + years.map(y => `<option value="${y}">FY ${y}-${y+1}</option>`).join('');

            if (state.sub === 'cluster') {
                nameSelect.classList.add('hidden');
            } else {
                nameSelect.classList.remove('hidden');
                const colKey = state.sub === 'agent' ? COL_AGENT : COL_MANAGER;
                const names = [...new Set(rawData.map(row => row[colKey]).filter(n => n))].sort();
                nameSelect.innerHTML = '<option value="">Select Name...</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
            }
            
            // Clear current view until selections are made
            document.getElementById('summary-section').innerHTML = '';
            document.getElementById('fy-grid').innerHTML = ''; 
            if(chartInstance) chartInstance.destroy();
        }

        // === CORE LOGIC ===
        function renderDashboard() {
            const selectedYear = parseInt(document.getElementById('year-select').value);
            const selectedName = document.getElementById('name-select').value;
            
            if (!selectedYear) return;
            if (state.sub !== 'cluster' && !selectedName) return;

            const fyData = Array.from({ length: 12 }, () => ({
                freshNOP: 0, freshAmount: 0,
                baseNOP: 0, renRenewed: 0, renMissed: 0
            }));

            // Totals for Summary Cards
            let totalFreshAmt = 0, totalFreshNOP = 0;
            let totalBaseNOP = 0, totalRenewed = 0, totalMissed = 0;

            rawData.forEach(row => {
                if(!row[COL_DATE]) return;
                const date = new Date(row[COL_DATE]);
                if (isNaN(date)) return;

                const tType = (row[COL_TRANSACTION] || '').toString().toLowerCase();
                
                // EXCLUSION RULE: Exclude endorsements entirely from all calculations
                if (tType.includes('endorsement')) return;

                const month = date.getMonth(); 
                const year = date.getFullYear();
                const rowFY = month >= 3 ? year : year - 1;

                if (state.sub === 'agent' && row[COL_AGENT] !== selectedName) return;
                if (state.sub === 'manager' && row[COL_MANAGER] !== selectedName) return;

                const fyMonthIndex = month >= 3 ? month - 3 : month + 9;
                
                const pType = (row[COL_TYPE] || '').toString().toLowerCase();
                const premium = parseFloat(row[COL_PREM]) || 0;

                const isFresh = pType.includes('new business') || tType.includes('fresh') || tType.includes('roll over');
                const isRenewal = pType.includes('renewal') || tType.includes('renewal');

                if (state.main === 'fresh') {
                    if (rowFY === selectedYear && isFresh) {
                        fyData[fyMonthIndex].freshNOP++;
                        fyData[fyMonthIndex].freshAmount += premium;
                        
                        totalFreshNOP++;
                        totalFreshAmt += premium;
                    }
                } 
                else if (state.main === 'renewal') {
                    // BASE NOP: ALL valid policies (Fresh + Renewal) from Previous Year
                    if (rowFY === (selectedYear - 1)) {
                        fyData[fyMonthIndex].baseNOP++;
                        totalBaseNOP++;
                    }
                    // RENEWED: Only Renewals from Current Year
                    if (rowFY === selectedYear && isRenewal) {
                        fyData[fyMonthIndex].renRenewed++;
                        totalRenewed++;
                    }
                }
            });

            // Calculate Missed for Renewal View
            if (state.main === 'renewal') {
                fyData.forEach(d => {
                    d.renMissed = Math.max(0, d.baseNOP - d.renRenewed);
                    totalMissed += d.renMissed;
                });
            }

            renderSummary(totalFreshAmt, totalFreshNOP, totalBaseNOP, totalRenewed, totalMissed);
            renderGrid(fyData);
            renderChart(fyData);
        }

        // === RENDERERS ===
        function renderSummary(tFreshAmt, tFreshNOP, tBase, tRenewed, tMissed) {
            const summaryDiv = document.getElementById('summary-section');
            
            if (state.main === 'fresh') {
                summaryDiv.innerHTML = `
                    <div class="bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl p-6 shadow-lg text-white col-span-1 md:col-span-2">
                        <div class="text-blue-100 text-sm font-semibold uppercase tracking-wider mb-1">Total Fresh Premium</div>
                        <div class="text-4xl font-extrabold">₹${tFreshAmt.toLocaleString('en-IN', {maximumFractionDigits: 0})}</div>
                    </div>
                    <div class="bg-white rounded-2xl p-6 shadow border border-gray-100 flex flex-col justify-center">
                        <div class="text-gray-500 text-sm font-semibold uppercase tracking-wider mb-1">Total Fresh NOP</div>
                        <div class="text-3xl font-extrabold text-gray-800">${tFreshNOP}</div>
                    </div>
                    <div class="bg-white rounded-2xl p-6 shadow border border-gray-100 flex flex-col justify-center">
                        <div class="text-gray-500 text-sm font-semibold uppercase tracking-wider mb-1">Avg Ticket Size</div>
                        <div class="text-3xl font-extrabold text-gray-800">₹${tFreshNOP > 0 ? Math.round(tFreshAmt / tFreshNOP).toLocaleString('en-IN') : 0}</div>
                    </div>
                `;
            } else {
                const renewPercent = tBase > 0 ? Math.round((tRenewed / tBase) * 100) : 0;
                summaryDiv.innerHTML = `
                    <div class="bg-white rounded-2xl p-6 shadow border border-gray-100">
                        <div class="text-gray-500 text-sm font-semibold uppercase tracking-wider mb-1">Total Base (Prev. Yr)</div>
                        <div class="text-3xl font-extrabold text-gray-800">${tBase}</div>
                    </div>
                    <div class="bg-gradient-to-br from-green-500 to-green-700 rounded-2xl p-6 shadow-lg text-white">
                        <div class="text-green-100 text-sm font-semibold uppercase tracking-wider mb-1">Total Renewed</div>
                        <div class="text-4xl font-extrabold">${tRenewed}</div>
                    </div>
                    <div class="bg-gradient-to-br from-red-500 to-red-700 rounded-2xl p-6 shadow-lg text-white">
                        <div class="text-red-100 text-sm font-semibold uppercase tracking-wider mb-1">Total Missed</div>
                        <div class="text-4xl font-extrabold">${tMissed}</div>
                    </div>
                    <div class="bg-white rounded-2xl p-6 shadow border border-gray-100">
                        <div class="text-gray-500 text-sm font-semibold uppercase tracking-wider mb-1">Retention Rate</div>
                        <div class="text-3xl font-extrabold text-gray-800">${renewPercent}%</div>
                    </div>
                `;
            }
        }

        function renderGrid(fyData) {
            const grid = document.getElementById('fy-grid');
            let html = '';

            fyData.forEach((data, index) => {
                const monthName = FY_MONTHS[index];
                
                if (state.main === 'fresh') {
                    html += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 transform hover:-translate-y-1 hover:shadow-md transition duration-200">
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">${monthName}</div>
                        <div class="text-xl font-bold text-blue-600 mb-1">₹${data.freshAmount.toLocaleString('en-IN', {maximumFractionDigits: 0})}</div>
                        <div class="text-sm font-medium text-gray-600"><span class="font-bold text-gray-800">${data.freshNOP}</span> NOP</div>
                    </div>`;
                } else {
                    html += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 transform hover:-translate-y-1 hover:shadow-md transition duration-200">
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">${monthName}</div>
                        <div class="text-lg font-bold text-gray-800 mb-2">Base: ${data.baseNOP}</div>
                        <div class="space-y-1 border-t border-gray-50 pt-2">
                            <div class="flex justify-between text-sm"><span class="text-gray-500">Renewed</span><span class="text-green-600 font-bold">${data.renRenewed}</span></div>
                            <div class="flex justify-between text-sm"><span class="text-gray-500">Missed</span><span class="text-red-500 font-bold">${data.renMissed}</span></div>
                        </div>
                    </div>`;
                }
            });
            grid.innerHTML = html;
        }

        function renderChart(fyData) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const labels = FY_MONTHS;
            let datasets = [];
            let chartOptions = { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8 } }
                }
            };

            if (state.main === 'fresh') {
                datasets = [
                    {
                        label: 'Fresh Premium (₹)',
                        data: fyData.map(d => d.freshAmount),
                        backgroundColor: 'rgba(37, 99, 235, 0.7)',
                        borderRadius: 4,
                        type: 'bar',
                        yAxisID: 'y'
                    },
                    {
                        label: 'Fresh NOP',
                        data: fyData.map(d => d.freshNOP),
                        borderColor: 'rgb(249, 115, 22)',
                        borderWidth: 3,
                        pointBackgroundColor: 'rgb(249, 115, 22)',
                        type: 'line',
                        tension: 0.4,
                        yAxisID: 'y1'
                    }
                ];
                chartOptions.scales = {
                    x: { grid: { display: false } },
                    y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Amount (₹)', color: '#6b7280' } },
                    y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'NOP Count', color: '#6b7280' } }
                };
            } else {
                datasets = [
                    {
                        label: 'Renewed',
                        data: fyData.map(d => d.renRenewed),
                        backgroundColor: 'rgba(34, 197, 94, 0.8)',
                        borderRadius: 4,
                        type: 'bar'
                    },
                    {
                        label: 'Missed',
                        data: fyData.map(d => d.renMissed),
                        backgroundColor: 'rgba(239, 68, 68, 0.8)',
                        borderRadius: 4,
                        type: 'bar'
                    }
                ];
                chartOptions.scales = {
                    x: { stacked: true, grid: { display: false } },
                    y: { stacked: true, title: { display: true, text: 'Policies', color: '#6b7280' } }
                };
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets },
                options: chartOptions
            });
        }
    </script>
</body>
</html>
