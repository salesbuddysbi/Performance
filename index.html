<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Performance Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- 1. Upload Overlay (Fallback) -->
    <div id="upload-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-8 rounded-lg shadow-xl text-center max-w-md w-full">
            <svg class="mx-auto h-12 w-12 text-blue-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <h2 class="text-2xl font-bold mb-2">Upload Master Data</h2>
            <p class="text-gray-500 mb-6 text-sm">No default data file found. Please upload your master Excel file to continue.</p>
            <input type="file" id="file-upload" accept=".xlsx, .xls" class="hidden">
            <button onclick="document.getElementById('file-upload').click()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition">Browse File</button>
        </div>
    </div>

    <!-- 2. Landing Page View -->
    <div id="landing-page" class="hidden flex-1 flex flex-col items-center justify-center bg-gray-100 h-full w-full fade-in z-40">
        <div class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-3">Performance Portal</h1>
            <p class="text-lg text-gray-600">Select a module to view business analytics</p>
        </div>
        
        <div class="max-w-4xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-8 w-full">
            <!-- Fresh Business Card -->
            <button onclick="openDashboard('fresh')" class="bg-white p-10 rounded-2xl shadow-md hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center justify-center gap-4 border border-gray-100 group">
                <div class="p-4 bg-blue-50 rounded-full group-hover:bg-blue-100 transition">
                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 group-hover:text-blue-600 transition">Fresh Business</h2>
                <p class="text-gray-500 text-center text-sm">Track new policy acquisitions, NOP counts, and fresh premium amounts.</p>
            </button>

            <!-- Renewal Performance Card -->
            <button onclick="openDashboard('renewal')" class="bg-white p-10 rounded-2xl shadow-md hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center justify-center gap-4 border border-gray-100 group">
                <div class="p-4 bg-green-50 rounded-full group-hover:bg-green-100 transition">
                    <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 group-hover:text-green-600 transition">Renewal Performance</h2>
                <p class="text-gray-500 text-center text-sm">Track retention against previous year's base, renewed policies, and missed counts.</p>
            </button>
        </div>
    </div>

    <!-- 3. Dashboard App View -->
    <div id="app-container" class="hidden flex-1 flex flex-col h-full fade-in">
        <!-- Header -->
        <header class="bg-white shadow-sm z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-4">
                    <div class="flex items-center gap-4">
                        <button onclick="goHome()" class="text-gray-400 hover:text-gray-600 transition">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        </button>
                        <h1 class="text-xl font-bold text-gray-900" id="dashboard-title">Performance Dashboard</h1>
                    </div>
                </div>
            </div>
        </header>

        <!-- Filters & Sub-modules -->
        <div class="bg-gray-50 border-b">
            <div class="max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex space-x-2 bg-gray-200 rounded-lg p-1 w-fit">
                    <button id="sub-agent" class="px-4 py-1 rounded shadow bg-white text-sm font-medium" onclick="switchSubModule('agent')">Agent</button>
                    <button id="sub-manager" class="px-4 py-1 rounded text-gray-600 text-sm font-medium hover:bg-gray-300 transition" onclick="switchSubModule('manager')">Manager</button>
                    <button id="sub-cluster" class="px-4 py-1 rounded text-gray-600 text-sm font-medium hover:bg-gray-300 transition" onclick="switchSubModule('cluster')">Cluster</button>
                </div>
                
                <div class="flex space-x-4">
                    <select id="year-select" class="block w-40 pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md shadow-sm" onchange="renderDashboard()">
                        <option value="">Select Year...</option>
                    </select>
                    
                    <select id="name-select" class="block w-64 pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md shadow-sm" onchange="renderDashboard()">
                        <option value="">Select Name...</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Dashboard Content -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-gray-100">
            <div class="max-w-7xl mx-auto space-y-6">
                
                <div class="flex justify-between items-end mb-2">
                    <h2 class="text-lg font-semibold text-gray-700">Financial Year Calendar</h2>
                    <span class="text-sm text-gray-500" id="data-context-label"></span>
                </div>
                
                <div id="fy-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                    <!-- Cards generated via JS -->
                </div>

                <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-700 mb-4">Performance Trend (FY)</h2>
                    <div class="relative h-72 w-full">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // === COLUMNS FOR "Kollam Cluster.xlsx" ===
        const COL_AGENT = "Intermediary Name";
        const COL_MANAGER = "SSM Name";
        const COL_DATE = "Policy Start Date";
        const COL_TYPE = "Policy Type"; 
        const COL_PREM = "GWP";
        const COL_TRANSACTION = "Transaction Type";

        const FY_MONTHS = ["Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "Jan", "Feb", "Mar"];

        let rawData = [];
        let chartInstance = null;
        let state = { main: 'fresh', sub: 'agent' };

        document.addEventListener("DOMContentLoaded", () => {
            attemptFetchDefaultFile();
            document.getElementById('file-upload').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) loadExcel(file);
            });
        });

        async function attemptFetchDefaultFile() {
            try {
                let response = await fetch('Kollam Cluster.xlsx');
                if (!response.ok) response = await fetch('data.xlsx');
                if (!response.ok) throw new Error('File not found');
                
                const arrayBuffer = await response.arrayBuffer();
                parseExcelData(arrayBuffer);
            } catch (error) {
                document.getElementById('upload-overlay').classList.remove('hidden');
            }
        }

        function loadExcel(file) {
            const reader = new FileReader();
            reader.onload = (e) => parseExcelData(e.target.result);
            reader.readAsArrayBuffer(file);
        }

        function parseExcelData(buffer) {
            try {
                const workbook = XLSX.read(buffer, { type: 'array', cellDates: true });
                rawData = [];
                workbook.SheetNames.forEach(sheetName => {
                    const sheet = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                    rawData = rawData.concat(sheet);
                });
                
                // Once data loaded, show landing page
                document.getElementById('upload-overlay').classList.add('hidden');
                document.getElementById('landing-page').classList.remove('hidden');
            } catch (err) {
                alert("Error parsing Excel file.");
                console.error(err);
            }
        }

        // === NAVIGATION LOGIC ===
        function openDashboard(mainModule) {
            state.main = mainModule;
            
            // UI Updates
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            document.getElementById('dashboard-title').innerText = mainModule === 'fresh' 
                ? 'Fresh Business Dashboard' 
                : 'Renewal Performance Dashboard';
            
            document.getElementById('data-context-label').innerText = mainModule === 'fresh'
                ? 'Monthly New Business'
                : '*Base NOP is calculated from previous year\'s Fresh Business';

            // Reset sub-module to agent on entry
            switchSubModule('agent'); 
        }

        function goHome() {
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('landing-page').classList.remove('hidden');
        }

        function switchSubModule(subModule) {
            state.sub = subModule;
            ['agent', 'manager', 'cluster'].forEach(m => {
                const btn = document.getElementById(`sub-${m}`);
                btn.className = m === subModule 
                    ? "px-4 py-1 rounded shadow bg-white text-sm font-medium" 
                    : "px-4 py-1 rounded text-gray-600 text-sm font-medium hover:bg-gray-300 transition";
            });
            updateDropdowns();
        }

        // === DROPDOWNS & FILTERING ===
        function updateDropdowns() {
            const yearSelect = document.getElementById('year-select');
            const nameSelect = document.getElementById('name-select');
            
            const years = [...new Set(rawData.map(row => {
                if(!row[COL_DATE]) return null;
                const d = new Date(row[COL_DATE]);
                if (isNaN(d)) return null;
                return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
            }).filter(y => y !== null))].sort((a, b) => b - a);

            yearSelect.innerHTML = '<option value="">Select Year...</option>' + years.map(y => `<option value="${y}">FY ${y}-${y+1}</option>`).join('');

            if (state.sub === 'cluster') {
                nameSelect.classList.add('hidden');
            } else {
                nameSelect.classList.remove('hidden');
                const colKey = state.sub === 'agent' ? COL_AGENT : COL_MANAGER;
                const names = [...new Set(rawData.map(row => row[colKey]).filter(n => n))].sort();
                nameSelect.innerHTML = '<option value="">Select Name...</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
            }
            
            document.getElementById('fy-grid').innerHTML = ''; 
            if(chartInstance) chartInstance.destroy();
        }

        // === CORE DASHBOARD ENGINE ===
        function renderDashboard() {
            const selectedYear = parseInt(document.getElementById('year-select').value);
            const selectedName = document.getElementById('name-select').value;
            
            if (!selectedYear) return;
            if (state.sub !== 'cluster' && !selectedName) return;

            const fyData = Array.from({ length: 12 }, () => ({
                freshNOP: 0, freshAmount: 0,
                baseNOP: 0, renRenewed: 0, renMissed: 0
            }));

            rawData.forEach(row => {
                if(!row[COL_DATE]) return;
                const date = new Date(row[COL_DATE]);
                if (isNaN(date)) return;

                const month = date.getMonth(); 
                const year = date.getFullYear();
                
                const rowFY = month >= 3 ? year : year - 1;

                // Agent/Manager Filter
                if (state.sub === 'agent' && row[COL_AGENT] !== selectedName) return;
                if (state.sub === 'manager' && row[COL_MANAGER] !== selectedName) return;

                // FY Month Alignment (April = 0, March = 11)
                const fyMonthIndex = month >= 3 ? month - 3 : month + 9;
                
                const pType = (row[COL_TYPE] || '').toString().toLowerCase();
                const tType = (row[COL_TRANSACTION] || '').toString().toLowerCase();
                const premium = parseFloat(row[COL_PREM]) || 0;

                const isFresh = pType.includes('new business') || tType.includes('fresh');
                const isRenewal = pType.includes('renewal') || tType.includes('renewal');

                if (state.main === 'fresh') {
                    // Standard current-year fresh tracking
                    if (rowFY === selectedYear && isFresh) {
                        fyData[fyMonthIndex].freshNOP++;
                        fyData[fyMonthIndex].freshAmount += premium;
                    }
                } 
                else if (state.main === 'renewal') {
                    // BASE NOP: Count fresh business from Previous Year (selectedYear - 1)
                    if (rowFY === (selectedYear - 1) && isFresh) {
                        fyData[fyMonthIndex].baseNOP++;
                    }
                    // RENEWED: Count renewals tracked in Current Year (selectedYear)
                    if (rowFY === selectedYear && isRenewal) {
                        fyData[fyMonthIndex].renRenewed++;
                    }
                }
            });

            // Calculate Missed for Renewal View
            if (state.main === 'renewal') {
                fyData.forEach(d => {
                    // Missed = Base Due - Actually Renewed (Floored at 0)
                    d.renMissed = Math.max(0, d.baseNOP - d.renRenewed);
                });
            }

            renderGrid(fyData);
            renderChart(fyData);
        }

        function renderGrid(fyData) {
            const grid = document.getElementById('fy-grid');
            let html = '';

            fyData.forEach((data, index) => {
                const monthName = FY_MONTHS[index];
                
                if (state.main === 'fresh') {
                    html += `
                    <div class="bg-white rounded-lg shadow border border-gray-100 p-4 transform hover:scale-105 transition">
                        <div class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">${monthName}</div>
                        <div class="text-2xl font-bold text-blue-600">₹${data.freshAmount.toLocaleString('en-IN', {maximumFractionDigits: 0})}</div>
                        <div class="text-sm text-gray-600 mt-1"><span class="font-semibold">${data.freshNOP}</span> NOP</div>
                    </div>`;
                } else {
                    html += `
                    <div class="bg-white rounded-lg shadow border border-gray-100 p-4 transform hover:scale-105 transition">
                        <div class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">${monthName}</div>
                        <div class="text-xl font-bold text-gray-800" title="Policies generated in ${monthName} of previous year">Base NOP: ${data.baseNOP}</div>
                        <div class="flex justify-between mt-2 text-sm pt-2 border-t border-gray-100">
                            <span class="text-green-600 font-bold">${data.renRenewed} Renewed</span>
                            <span class="text-red-500 font-bold">${data.renMissed} Missed</span>
                        </div>
                    </div>`;
                }
            });
            grid.innerHTML = html;
        }

        function renderChart(fyData) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const labels = FY_MONTHS;
            let datasets = [];
            let chartOptions = { responsive: true, maintainAspectRatio: false };

            if (state.main === 'fresh') {
                datasets = [
                    {
                        label: 'Fresh Business Amount (₹)',
                        data: fyData.map(d => d.freshAmount),
                        backgroundColor: 'rgba(59, 130, 246, 0.5)',
                        borderColor: 'rgb(59, 130, 246)',
                        borderWidth: 2,
                        type: 'bar',
                        yAxisID: 'y'
                    },
                    {
                        label: 'Fresh NOP',
                        data: fyData.map(d => d.freshNOP),
                        borderColor: 'rgb(249, 115, 22)',
                        borderWidth: 2,
                        type: 'line',
                        tension: 0.3,
                        yAxisID: 'y1'
                    }
                ];
                chartOptions.scales = {
                    y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Amount' } },
                    y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'NOP' } }
                };
            } else {
                datasets = [
                    {
                        label: 'Renewed',
                        data: fyData.map(d => d.renRenewed),
                        backgroundColor: 'rgba(34, 197, 94, 0.7)',
                        type: 'bar'
                    },
                    {
                        label: 'Missed',
                        data: fyData.map(d => d.renMissed),
                        backgroundColor: 'rgba(239, 68, 68, 0.7)',
                        type: 'bar'
                    }
                ];
                chartOptions.scales = {
                    x: { stacked: true },
                    y: { stacked: true, title: { display: true, text: 'Number of Policies (Target Base NOP)' } }
                };
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets },
                options: chartOptions
            });
        }
    </script>
</body>
</html>
