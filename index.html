<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Performance Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        
        /* Smooth Animations */
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* Sophisticated UI Elements */
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .stat-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #f1f5f9; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); border-color: #e2e8f0; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Dropdown Styling */
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; cursor: pointer; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-blue-100 selection:text-blue-900">

    <!-- 0. Upload Overlay -->
    <div id="upload-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white p-8 md:p-10 rounded-[2rem] shadow-2xl text-center max-w-md w-full slide-up border border-white/20">
            <div class="bg-blue-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            </div>
            <h2 class="text-3xl font-extrabold mb-3 text-slate-800 tracking-tight">Master Data</h2>
            <p class="text-slate-500 mb-8 text-sm">Please upload your master Excel file to initialize the portal.</p>
            <input type="file" id="file-upload" accept=".xlsx, .xls" class="hidden">
            <button onclick="document.getElementById('file-upload').click()" class="bg-slate-900 hover:bg-blue-600 text-white font-semibold py-4 px-8 rounded-2xl shadow-lg hover:shadow-blue-500/30 transition-all duration-300 w-full text-lg">Browse File</button>
        </div>
    </div>

    <!-- VIEW 1: HOME -->
    <div id="view-home" class="hidden flex-1 flex flex-col items-center justify-center bg-gradient-to-b from-slate-50 to-slate-100 h-full w-full fade-in z-40 px-4 relative overflow-y-auto py-10">
        <div class="z-10 mb-10 md:mb-16 text-center slide-up">
            <span class="inline-block py-1 px-3 rounded-full bg-blue-100 text-blue-700 text-xs font-bold tracking-widest uppercase mb-4">Analytics Portal</span>
            <h1 class="text-4xl md:text-6xl font-extrabold text-slate-900 tracking-tight">Business <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">Performance</span></h1>
        </div>
        
        <div class="z-10 max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 w-full slide-up" style="animation-delay: 0.1s;">
            <!-- Fresh Business -->
            <button onclick="navToRole('fresh')" class="bg-white p-8 md:p-12 rounded-[2rem] shadow-sm hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 border border-slate-100 group flex flex-col items-center justify-center text-center relative overflow-hidden h-full min-h-[280px]">
                <div class="absolute top-0 right-0 w-32 h-32 bg-blue-50 rounded-bl-[4rem] -z-10 transition-transform duration-500 group-hover:scale-125"></div>
                <div class="w-20 h-20 bg-blue-600 rounded-[1.5rem] flex items-center justify-center mb-6 shadow-lg shadow-blue-600/30 group-hover:rotate-6 transition-transform duration-300">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                </div>
                <h2 class="text-3xl md:text-4xl font-extrabold text-slate-800 group-hover:text-blue-600 transition-colors">Fresh Business</h2>
            </button>

            <!-- Renewal Performance -->
            <button onclick="navToRole('renewal')" class="bg-white p-8 md:p-12 rounded-[2rem] shadow-sm hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 border border-slate-100 group flex flex-col items-center justify-center text-center relative overflow-hidden h-full min-h-[280px]">
                <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-50 rounded-bl-[4rem] -z-10 transition-transform duration-500 group-hover:scale-125"></div>
                <div class="w-20 h-20 bg-indigo-600 rounded-[1.5rem] flex items-center justify-center mb-6 shadow-lg shadow-indigo-600/30 group-hover:-rotate-6 transition-transform duration-300">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </div>
                <h2 class="text-3xl md:text-4xl font-extrabold text-slate-800 group-hover:text-indigo-600 transition-colors">Renewal Performance</h2>
            </button>
        </div>
    </div>

    <!-- VIEW 2: ROLE SELECTION -->
    <div id="view-role" class="hidden flex-1 flex flex-col items-center justify-center bg-gradient-to-b from-slate-50 to-slate-100 h-full w-full fade-in z-40 px-4 relative overflow-y-auto py-10">
        <div class="absolute top-6 left-6 md:top-10 md:left-10 z-50">
            <button onclick="showView('view-home')" class="flex items-center text-slate-500 hover:text-slate-900 transition-colors font-bold text-sm bg-white/50 px-4 py-2 rounded-full shadow-sm backdrop-blur-md">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Back
            </button>
        </div>

        <div class="z-10 mb-10 md:mb-16 text-center slide-up">
            <h2 class="text-xs font-black tracking-widest text-blue-600 uppercase mb-3 bg-blue-100 inline-block px-3 py-1 rounded-full" id="role-breadcrumb">Module</h2>
            <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 tracking-tight">Select Hierarchy</h1>
        </div>
        
        <div class="z-10 max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-5 md:gap-6 w-full slide-up" style="animation-delay: 0.1s;">
            <button onclick="navToDashboard('agent')" class="bg-white p-8 rounded-3xl shadow-sm hover:shadow-xl transition-all transform hover:-translate-y-2 border border-slate-100 group text-center flex flex-col items-center justify-center">
                <div class="w-16 h-16 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center mb-5 group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <h2 class="text-xl font-bold text-slate-800">Agent</h2>
            </button>

            <button onclick="navToDashboard('manager')" class="bg-white p-8 rounded-3xl shadow-sm hover:shadow-xl transition-all transform hover:-translate-y-2 border border-slate-100 group text-center flex flex-col items-center justify-center">
                <div class="w-16 h-16 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center mb-5 group-hover:bg-indigo-600 group-hover:text-white transition-colors duration-300">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </div>
                <h2 class="text-xl font-bold text-slate-800">Manager</h2>
            </button>

            <button onclick="navToDashboard('cluster')" class="bg-white p-8 rounded-3xl shadow-sm hover:shadow-xl transition-all transform hover:-translate-y-2 border border-slate-100 group text-center flex flex-col items-center justify-center">
                <div class="w-16 h-16 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center mb-5 group-hover:bg-slate-900 group-hover:text-white transition-colors duration-300">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                </div>
                <h2 class="text-xl font-bold text-slate-800">Cluster</h2>
            </button>
        </div>
    </div>

    <!-- VIEW 3: DASHBOARD -->
    <div id="view-dashboard" class="hidden flex-1 flex flex-col h-full bg-slate-50 fade-in">
        
        <!-- Header -->
        <header class="glass-panel sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center h-20">
                    <button onclick="showView('view-role')" class="mr-4 md:mr-6 p-2.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors shadow-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <div class="flex flex-col justify-center">
                        <h1 class="text-xl md:text-2xl font-extrabold text-slate-900 leading-tight tracking-tight" id="dashboard-title">Performance</h1>
                        <p class="text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mt-0.5" id="dashboard-subtitle">Agent Level</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Filters Section -->
        <div class="bg-white border-b border-slate-200 shadow-[0_2px_10px_-3px_rgba(6,81,237,0.05)] z-20">
            <div class="max-w-7xl mx-auto px-4 py-5 sm:px-6 lg:px-8">
                <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-5 w-full">
                    
                    <div class="relative w-full sm:w-1/3 md:w-1/4 lg:w-64 group">
                        <select id="year-select" class="block w-full pl-5 pr-10 py-3.5 text-sm font-bold text-slate-700 bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 focus:bg-white rounded-2xl shadow-sm transition-all" onchange="renderDashboard()">
                            <option value="">Select Financial Year</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-slate-400 group-hover:text-blue-500 transition-colors">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                    
                    <div id="name-container" class="relative w-full sm:w-2/3 md:w-1/2 lg:w-96 group">
                        <select id="name-select" class="block w-full pl-5 pr-10 py-3.5 text-sm font-bold text-slate-700 bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 focus:bg-white rounded-2xl shadow-sm transition-all" onchange="renderDashboard()">
                            <option value="">Search / Select Target Name</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-slate-400 group-hover:text-blue-500 transition-colors">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Dashboard Content Area -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 relative">
            
            <div id="empty-state" class="flex flex-col items-center justify-center h-full min-h-[300px] text-center slide-up">
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-5 border border-slate-200">
                    <svg class="w-10 h-10 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </div>
                <p class="text-slate-500 font-medium text-sm">Awaiting filter selection.</p>
            </div>

            <div class="max-w-7xl mx-auto space-y-6 hidden slide-up" id="dashboard-content">
                
                <div id="summary-section" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-5">
                    <!-- Injected via JS -->
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                    <div class="xl:col-span-2 space-y-4">
                        <div class="flex flex-col bg-white p-5 md:p-6 rounded-3xl shadow-sm border border-slate-100">
                            <h2 class="text-lg md:text-xl font-extrabold text-slate-800">Monthly Progression</h2>
                        </div>
                        <div id="fy-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
                            <!-- Cards generated via JS -->
                        </div>
                    </div>

                    <div class="xl:col-span-1 bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 flex flex-col h-[450px] xl:h-auto">
                        <h2 class="text-lg md:text-xl font-extrabold text-slate-800 mb-6">Annual Trend</h2>
                        <div class="relative flex-1 w-full min-h-[250px]">
                            <canvas id="performanceChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="h-10"></div>
        </main>
    </div>

    <script>
        const COL_AGENT = "Intermediary Name";
        const COL_MANAGER = "SSM Name";
        const COL_DATE = "Policy Start Date";
        const COL_PREM = "GWP";
        const COL_TRANSACTION = "Transaction Type";

        const FY_MONTHS = ["Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "Jan", "Feb", "Mar"];

        let rawData = [];
        let chartInstance = null;
        let state = { main: null, sub: null };

        document.addEventListener("DOMContentLoaded", () => {
            attemptFetchDefaultFile();
            document.getElementById('file-upload').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) loadExcel(file);
            });
        });

        async function attemptFetchDefaultFile() {
            try {
                let response = await fetch('Kollam Cluster.xlsx');
                if (!response.ok) response = await fetch('data.xlsx');
                if (!response.ok) throw new Error('File not found');
                
                const arrayBuffer = await response.arrayBuffer();
                parseExcelData(arrayBuffer);
            } catch (error) {
                document.getElementById('upload-overlay').classList.remove('hidden');
            }
        }

        function loadExcel(file) {
            const reader = new FileReader();
            reader.onload = (e) => parseExcelData(e.target.result);
            reader.readAsArrayBuffer(file);
        }

        function parseExcelData(buffer) {
            try {
                const workbook = XLSX.read(buffer, { type: 'array', cellDates: true });
                rawData = [];
                workbook.SheetNames.forEach(sheetName => {
                    const sheet = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                    rawData = rawData.concat(sheet);
                });
                
                document.getElementById('upload-overlay').classList.add('hidden');
                showView('view-home');
            } catch (err) {
                alert("Error parsing Excel file.");
                console.error(err);
            }
        }

        function showView(viewId) {
            ['view-home', 'view-role', 'view-dashboard'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function navToRole(mainModule) {
            state.main = mainModule;
            document.getElementById('role-breadcrumb').innerText = mainModule === 'fresh' ? 'Fresh Business' : 'Renewal Performance';
            showView('view-role');
        }

        function navToDashboard(subModule) {
            state.sub = subModule;
            
            const mainTitle = state.main === 'fresh' ? 'Fresh Business' : 'Renewal Performance';
            const subTitle = subModule === 'agent' ? 'Agent Performance' : subModule === 'manager' ? 'Manager Performance' : 'Cluster Performance';
            
            document.getElementById('dashboard-title').innerText = mainTitle;
            document.getElementById('dashboard-subtitle').innerText = subTitle;
            
            document.getElementById('year-select').value = "";
            document.getElementById('name-select').value = "";
            
            populateFilters();
            resetDashboardView();
            showView('view-dashboard');
        }

        function resetDashboardView() {
            document.getElementById('empty-state').classList.remove('hidden');
            document.getElementById('dashboard-content').classList.add('hidden');
            if(chartInstance) chartInstance.destroy();
        }

        function populateFilters() {
            const yearSelect = document.getElementById('year-select');
            const nameContainer = document.getElementById('name-container');
            const nameSelect = document.getElementById('name-select');
            
            const years = [...new Set(rawData.map(row => {
                if(!row[COL_DATE]) return null;
                const d = new Date(row[COL_DATE]);
                if (isNaN(d)) return null;
                return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
            }).filter(y => y !== null))].sort((a, b) => b - a);

            yearSelect.innerHTML = '<option value="">Select Financial Year</option>' + years.map(y => `<option value="${y}">FY ${y}-${y+1}</option>`).join('');

            if (state.sub === 'cluster') {
                nameContainer.classList.add('hidden'); 
            } else {
                nameContainer.classList.remove('hidden');
                const colKey = state.sub === 'agent' ? COL_AGENT : COL_MANAGER;
                const names = [...new Set(rawData.map(row => row[colKey]).filter(n => n))].sort();
                
                nameSelect.innerHTML = '<option value="">Search / Select Target Name</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
            }
        }

        function renderDashboard() {
            const selectedYear = parseInt(document.getElementById('year-select').value);
            const selectedName = document.getElementById('name-select').value;
            
            if (!selectedYear) return resetDashboardView();
            if (state.sub !== 'cluster' && !selectedName) return resetDashboardView();

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('dashboard-content').classList.remove('hidden');

            const fyData = Array.from({ length: 12 }, () => ({
                freshNOP: 0, freshAmount: 0,
                baseNOP: 0, renRenewed: 0, renMissed: 0, yetToRenew: 0, isFuture: false
            }));

            let totalFreshAmt = 0, totalFreshNOP = 0;
            let totalBaseNOP = 0, totalRenewed = 0, totalMissed = 0, totalYet = 0;

            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth(); 

            rawData.forEach(row => {
                if(!row[COL_DATE]) return;
                const date = new Date(row[COL_DATE]);
                if (isNaN(date)) return;

                if (state.sub === 'agent' && row[COL_AGENT] !== selectedName) return;
                if (state.sub === 'manager' && row[COL_MANAGER] !== selectedName) return;

                const month = date.getMonth(); 
                const year = date.getFullYear();
                const rowFY = month >= 3 ? year : year - 1;
                const fyMonthIndex = month >= 3 ? month - 3 : month + 9;
                
                const tType = (row[COL_TRANSACTION] || '').toString().toLowerCase();
                const premium = parseFloat(row[COL_PREM]) || 0;

                const isFreshBaseTx = tType.includes('fresh') || tType.includes('roll over');
                const isRenewalTx = tType.includes('our renewal');
                const isCancelTx = tType.includes('cancel'); 

                if (state.main === 'fresh') {
                    if (rowFY === selectedYear) {
                        if (isFreshBaseTx) {
                            fyData[fyMonthIndex].freshNOP += 1;
                            fyData[fyMonthIndex].freshAmount += premium;
                            totalFreshNOP += 1;
                            totalFreshAmt += premium;
                        } 
                        else if (isCancelTx) {
                            fyData[fyMonthIndex].freshNOP -= 1;
                            const cancelAmt = premium > 0 ? -Math.abs(premium) : premium; 
                            fyData[fyMonthIndex].freshAmount += cancelAmt;
                            totalFreshNOP -= 1;
                            totalFreshAmt += cancelAmt;
                        }
                    }
                } 
                else if (state.main === 'renewal') {
                    if (rowFY === (selectedYear - 1) && (isFreshBaseTx || isRenewalTx)) {
                        fyData[fyMonthIndex].baseNOP += 1;
                        totalBaseNOP += 1;
                    }
                    if (rowFY === selectedYear && isRenewalTx) {
                        fyData[fyMonthIndex].renRenewed += 1;
                        totalRenewed += 1;
                    }
                }
            });

            if (state.main === 'renewal') {
                fyData.forEach((d, index) => {
                    const calMonth = (index + 3) % 12;
                    const calYear = index < 9 ? selectedYear : selectedYear + 1;

                    const isFuture = (calYear > currentYear) || (calYear === currentYear && calMonth > currentMonth);
                    d.isFuture = isFuture;

                    const shortfall = Math.max(0, d.baseNOP - d.renRenewed);

                    if (isFuture) {
                        d.renMissed = 0;
                        d.yetToRenew = shortfall;
                    } else {
                        d.renMissed = shortfall;
                        d.yetToRenew = 0;
                    }

                    totalMissed += d.renMissed;
                    totalYet += d.yetToRenew;
                });
            }

            renderSummary(totalFreshAmt, totalFreshNOP, totalBaseNOP, totalRenewed, totalMissed, totalYet);
            renderGrid(fyData);
            renderChart(fyData);
        }

        function renderSummary(tFreshAmt, tFreshNOP, tBase, tRenewed, tMissed, tYet) {
            const summaryDiv = document.getElementById('summary-section');
            
            if (state.main === 'fresh') {
                summaryDiv.innerHTML = `
                    <div class="bg-slate-900 rounded-[2rem] p-6 md:p-8 shadow-xl text-white col-span-1 md:col-span-2 relative overflow-hidden">
                        <div class="absolute -top-10 -right-10 w-40 h-40 bg-blue-500 rounded-full blur-3xl opacity-20"></div>
                        <div class="text-slate-400 text-xs font-black uppercase tracking-widest mb-2 z-10 relative">Net Fresh Premium</div>
                        <div class="text-4xl md:text-5xl font-extrabold tracking-tight z-10 relative">₹${tFreshAmt.toLocaleString('en-IN', {maximumFractionDigits: 0})}</div>
                    </div>
                    <div class="bg-white rounded-[2rem] p-6 md:p-8 shadow-sm border border-slate-100 flex flex-col justify-center">
                        <div class="text-slate-400 text-xs font-black uppercase tracking-widest mb-2">Net Fresh NOP</div>
                        <div class="text-4xl font-extrabold text-blue-600">${tFreshNOP}</div>
                    </div>
                    <div class="bg-white rounded-[2rem] p-6 md:p-8 shadow-sm border border-slate-100 flex flex-col justify-center">
                        <div class="text-slate-400 text-xs font-black uppercase tracking-widest mb-2">Avg Ticket Size</div>
                        <div class="text-3xl font-extrabold text-slate-800">₹${tFreshNOP > 0 ? Math.round(tFreshAmt / tFreshNOP).toLocaleString('en-IN') : 0}</div>
                    </div>
                `;
            } else {
                const renewPercent = tBase > 0 ? Math.round((tRenewed / tBase) * 100) : 0;
                summaryDiv.innerHTML = `
                    <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100 relative overflow-hidden">
                        <div class="text-slate-400 text-[10px] md:text-xs font-black uppercase tracking-widest mb-1">Target Base</div>
                        <div class="text-3xl font-extrabold text-slate-800">${tBase}</div>
                    </div>
                    <div class="bg-emerald-50 rounded-[2rem] p-6 shadow-sm border border-emerald-100">
                        <div class="text-emerald-500 text-[10px] md:text-xs font-black uppercase tracking-widest mb-1">Renewed</div>
                        <div class="text-3xl font-extrabold text-emerald-600">${tRenewed}</div>
                    </div>
                    <div class="bg-rose-50 rounded-[2rem] p-6 shadow-sm border border-rose-100 flex justify-between items-center">
                        <div>
                            <div class="text-rose-500 text-[10px] md:text-xs font-black uppercase tracking-widest mb-1">Missed (To Date)</div>
                            <div class="text-3xl font-extrabold text-rose-600">${tMissed}</div>
                        </div>
                    </div>
                    <div class="bg-slate-900 rounded-[2rem] p-6 shadow-lg text-white">
                        <div class="text-slate-400 text-[10px] md:text-xs font-black uppercase tracking-widest mb-1">Yet To Renew</div>
                        <div class="flex items-end justify-between">
                            <div class="text-3xl font-extrabold text-amber-400">${tYet}</div>
                            <div class="text-xs font-bold text-slate-400 bg-slate-800 px-2 py-1 rounded-md">Rt: ${renewPercent}%</div>
                        </div>
                    </div>
                `;
            }
        }

        function renderGrid(fyData) {
            const grid = document.getElementById('fy-grid');
            let html = '';

            fyData.forEach((data, index) => {
                const monthName = FY_MONTHS[index];
                
                if (state.main === 'fresh') {
                    html += `
                    <div class="bg-white rounded-2xl border border-slate-100 p-4 md:p-5 stat-card">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs md:text-sm font-black text-slate-300 uppercase tracking-widest">${monthName}</span>
                            <span class="bg-blue-50 text-blue-600 text-xs font-bold px-2 py-1 rounded-lg">${data.freshNOP} NOP</span>
                        </div>
                        <div class="text-lg md:text-xl font-extrabold text-slate-800 break-words">₹${data.freshAmount.toLocaleString('en-IN', {maximumFractionDigits: 0})}</div>
                    </div>`;
                } else {
                    
                    const badge = data.isFuture 
                        ? `<span class="bg-amber-50 text-amber-600 border border-amber-100 text-[10px] font-bold px-2 py-0.5 rounded-full">Future</span>`
                        : `<span class="bg-slate-50 text-slate-400 border border-slate-100 text-[10px] font-bold px-2 py-0.5 rounded-full">Passed</span>`;

                    html += `
                    <div class="bg-white rounded-2xl border border-slate-100 p-4 md:p-5 stat-card relative">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs md:text-sm font-black text-slate-300 uppercase tracking-widest">${monthName}</span>
                            ${badge}
                        </div>
                        <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Base: <span class="text-slate-700">${data.baseNOP}</span></div>
                        
                        <div class="space-y-1.5 mt-3 pt-3 border-t border-slate-50">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-slate-500 font-semibold">Renewed</span>
                                <span class="text-emerald-600 font-black">${data.renRenewed}</span>
                            </div>
                            ${data.isFuture 
                                ? `<div class="flex justify-between items-center text-xs">
                                     <span class="text-amber-500 font-semibold">Pending</span>
                                     <span class="text-amber-500 font-black">${data.yetToRenew}</span>
                                   </div>` 
                                : `<div class="flex justify-between items-center text-xs">
                                     <span class="text-slate-500 font-semibold">Missed</span>
                                     <span class="text-rose-500 font-black">${data.renMissed}</span>
                                   </div>`
                            }
                        </div>
                    </div>`;
                }
            });
            grid.innerHTML = html;
        }

        function renderChart(fyData) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const labels = FY_MONTHS;
            let datasets = [];
            let chartOptions = { 
                responsive: true, 
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20, font: { family: 'Inter', weight: '600' } } },
                    tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.95)', titleFont: { size: 13, family: 'Inter' }, bodyFont: { size: 13, family: 'Inter', weight: 'bold' }, padding: 12, cornerRadius: 12 }
                }
            };

            if (state.main === 'fresh') {
                datasets = [
                    {
                        label: 'Net Premium (₹)',
                        data: fyData.map(d => d.freshAmount),
                        backgroundColor: '#3b82f6',
                        hoverBackgroundColor: '#2563eb',
                        borderRadius: 6,
                        type: 'bar',
                        yAxisID: 'y'
                    },
                    {
                        label: 'Net NOP',
                        data: fyData.map(d => d.freshNOP),
                        borderColor: '#f59e0b',
                        backgroundColor: '#f59e0b',
                        borderWidth: 3,
                        pointRadius: 4,
                        pointBackgroundColor: '#fff',
                        type: 'line',
                        tension: 0.4,
                        yAxisID: 'y1'
                    }
                ];
                chartOptions.scales = {
                    x: { grid: { display: false }, ticks: { font: { family: 'Inter' } } },
                    y: { type: 'linear', display: true, position: 'left', grid: { color: '#f1f5f9' }, border: { dash: [4, 4] }, title: { display: false } },
                    y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: false } }
                };
            } else {
                datasets = [
                    {
                        label: 'Renewed',
                        data: fyData.map(d => d.renRenewed),
                        backgroundColor: 'rgba(16, 185, 129, 0.85)',
                        hoverBackgroundColor: 'rgba(5, 150, 105, 1)',
                        borderRadius: { topLeft: 6, topRight: 6, bottomLeft: 0, bottomRight: 0 },
                        type: 'bar'
                    },
                    {
                        label: 'Missed (Past)',
                        data: fyData.map(d => d.renMissed),
                        backgroundColor: 'rgba(244, 63, 94, 0.85)',
                        hoverBackgroundColor: 'rgba(225, 29, 72, 1)',
                        borderRadius: { topLeft: 6, topRight: 6, bottomLeft: 0, bottomRight: 0 },
                        type: 'bar'
                    },
                    {
                        label: 'Yet to Renew (Future)',
                        data: fyData.map(d => d.yetToRenew),
                        backgroundColor: 'rgba(251, 191, 36, 0.85)',
                        hoverBackgroundColor: 'rgba(245, 158, 11, 1)',
                        borderRadius: { topLeft: 6, topRight: 6, bottomLeft: 0, bottomRight: 0 },
                        type: 'bar'
                    }
                ];
                chartOptions.scales = {
                    x: { stacked: true, grid: { display: false }, ticks: { font: { family: 'Inter' } } },
                    y: { stacked: true, grid: { color: '#f1f5f9' }, border: { dash: [4, 4] }, title: { display: false } }
                };
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets },
                options: chartOptions
            });
        }
    </script>
</body>
</html>
